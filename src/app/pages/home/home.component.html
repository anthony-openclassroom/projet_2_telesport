<app-header />
<div class="home-page">
  <p *ngIf="error" class="error-message" role="alert">
    An error occurred while loading data: {{ error }}
  </p>

  <figure class="chart-container">
    <canvas
      id="DashboardPieChart"
      aria-label="Pie chart showing medals distribution"
      role="img"
      >{{ pieChart }}</canvas
    >
    <figcaption class="sr-only">Distribution of Medals per Country</figcaption>
  </figure>
</div>
